<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn4Plus | Hanzi Practice</title><link rel="icon" href="favicon.ico"><script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183052;background:#edf5ff}*{box-sizing:border-box}body{margin:0}.top{background:#fff;border-bottom:1px solid #d8e5f7;padding:14px clamp(16px,3vw,44px);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.3rem;color:#1761b8}.brand img{width:43px;height:43px;object-fit:contain}.home{color:#1761b8;text-decoration:none;border:1px solid #c5daf4;border-radius:12px;padding:10px 16px;font-weight:700}main{max-width:1600px;margin:auto;padding:24px clamp(12px,2.5vw,36px)}h1{margin:0 0 5px;font-size:clamp(1.5rem,3vw,2.2rem)}.sub{color:#62758d;margin:0 0 20px}.panel{background:#fff;border:1px solid #dce8f7;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 7px 24px #1a4c8910}label{font-weight:700;display:block;margin-bottom:7px}textarea{width:100%;resize:vertical;min-height:62px;border:1px solid #c8d9ed;border-radius:11px;padding:12px;font:1.35rem system-ui;color:#17375c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}button{border:1px solid #b9d2ef;border-radius:11px;background:white;color:#174878;font:600 0.95rem system-ui;padding:12px 15px;cursor:pointer}button.primary{background:#2268cf;border-color:#2268cf;color:white}button:disabled{opacity:.5;cursor:wait}.check{display:flex;gap:8px;align-items:center;margin:0 4px;font-weight:500}.check input{width:19px;height:19px}.status{color:#58718f;margin:12px 0 0;min-height:24px}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:flex-start}.tile{width:var(--tile-size,280px);max-width:100%;border:1px solid #d8e5f5;border-radius:15px;padding:10px;background:#fff}.canvas{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;background:#fff;border:1px solid #e2eaf5}.canvas:before,.canvas:after{content:"";position:absolute;pointer-events:none;background:#e9eef7}.canvas:before{width:1px;top:0;bottom:0;left:50%}.canvas:after{height:1px;left:0;right:0;top:50%}.canvas svg{position:relative;z-index:1;display:block}.tilefoot{display:flex;justify-content:space-between;gap:5px;margin-top:9px;align-items:center}.hanzi{font-size:1.35rem;font-weight:700}.meta{font-size:.83rem;color:#607893}.empty{text-align:center;color:#617994;padding:35px}.note{font-size:.85rem;color:#617994} @media(max-width:600px){main{padding:14px 8px}.panel{padding:12px}.toolbar button{padding:10px}.grid{gap:8px}.tile{padding:6px}}
</style></head><body><header class="top"><div class="brand"><img src="favicon.ico" alt="Learn4Plus logo">Learn4Plus</div><a class="home" href="index.html">← Go Home</a></header><main><h1>汉字书写练习 · Hanzi Practice</h1><p class="sub">Write up to five Chinese characters. Practice with a mouse, finger, or Apple Pencil.</p><section class="panel"><label for="phrase">Your Chinese characters (maximum 5)</label><textarea id="phrase" rows="2" spellcheck="false">你好</textarea><div class="toolbar"><button class="primary" id="load">Load characters</button><label class="check"><input type="checkbox" id="trace" checked>Show tracing guides</label><button id="practice">✏️ Practice All</button><button id="animate">▶ Animate All in Order</button><button id="stop">■ Stop</button><button id="reset">↺ Reset</button></div><p class="status" id="status" role="status">Loading…</p></section><section class="panel"><div class="grid" id="grid"></div></section><p class="note">Uses Hanzi Writer's online stroke library. An internet connection is required. The checker evaluates stroke order, direction, and approximate shape.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),grid=$('grid'),status=$('status'),trace=$('trace');let entries=[],generation=0,playing=false;const isHanzi=c=>/[\u3400-\u9fff\uf900-\ufaff]/u.test(c);function chars(){return Array.from($('phrase').value).filter(isHanzi).slice(0,5)}function message(s){status.textContent=s}function setSize(){const n=Math.max(1,entries.length),gap=12,available=grid.clientWidth||window.innerWidth-40;const size=Math.min(480,Math.max(90,Math.floor((available-gap*(n-1))/n)));grid.style.setProperty('--tile-size',size+'px');for(const e of entries){if(e.size!==size){e.size=size;e.canvas.innerHTML='';makeWriter(e)}}}function makeWriter(e){if(!window.HanziWriter){e.note.textContent='Library script could not load';return}try{e.writer=HanziWriter.create(e.canvas,e.char,{width:e.size-22,height:e.size-22,padding:12,showOutline:trace.checked,showCharacter:false,strokeColor:'#2268cf',outlineColor:'#d4dce9',drawingColor:'#245ad0',drawingWidth:8,leniency:1.05,showHintAfterMisses:5,highlightOnComplete:true,charDataLoader:(char,onLoad,onError)=>{fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/'+encodeURIComponent(char)+'.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{e.loaded=true;e.note.textContent='Ready';onLoad(data)}).catch(err=>{e.note.textContent='Could not load stroke data ('+err.message+')';onError(err)})}})}catch(err){e.note.textContent='Error: '+err.message}}
function cancel(){generation++;playing=false;for(const e of entries){try{e.writer?.cancelQuiz()}catch(_){}try{e.writer?.hideCharacter()}catch(_){}}}function create(){cancel();entries=[];grid.innerHTML='';const list=chars();if(!list.length){message('Enter 1–5 Chinese characters.');grid.innerHTML='<p class="empty">No characters entered.</p>';return}if(Array.from($('phrase').value).filter(isHanzi).length>5)message('Only the first five Chinese characters were loaded.');else message(list.length+' characters loaded.');list.forEach((char,i)=>{const tile=document.createElement('div');tile.className='tile';const canvas=document.createElement('div');canvas.className='canvas';const foot=document.createElement('div');foot.className='tilefoot';const name=document.createElement('span');name.className='hanzi';name.textContent=char;const num=document.createElement('span');num.className='meta';num.textContent=(i+1)+'/'+list.length;foot.append(name,num);const note=document.createElement('div');note.className='meta';note.textContent='Loading stroke data…';tile.append(canvas,foot,note);grid.append(tile);entries.push({char,canvas,note,writer:null,loaded:false,size:0,mistakes:0})});setSize()}
function practice(){cancel();let count=0;for(const e of entries){if(!e.loaded||!e.writer)continue;count++;e.mistakes=0;e.note.textContent='Practice: 0 mistakes';e.writer.quiz({leniency:1.05,showHintAfterMisses:5,onMistake:()=>{e.mistakes++;e.note.textContent=e.mistakes+' mistake(s)'},onComplete:()=>{e.note.textContent='✓ Complete · '+e.mistakes+' mistake(s)'}})}message(count?'Practice mode: write in any box.':'Wait for character data to load, then try again.')}
async function animate(){cancel();const token=generation;playing=true;message('Animating characters in order…');for(const e of entries){if(token!==generation)break;if(!e.loaded||!e.writer)continue;e.note.textContent='Animating…';try{await new Promise(resolve=>e.writer.animateCharacter({onComplete:resolve}))}catch(_){}if(token!==generation)break;e.note.textContent='✓ Animation complete'}if(token===generation){playing=false;message('Animation finished.')}}
$('load').onclick=create;$('practice').onclick=practice;$('animate').onclick=animate;$('stop').onclick=()=>{cancel();message('Stopped.')};$('reset').onclick=()=>{create();message('Reset complete.')};trace.onchange=()=>{for(const e of entries){if(!e.writer)continue;try{trace.checked?e.writer.showOutline():e.writer.hideOutline()}catch(_){}}};let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(entries.length){cancel();setSize();message('Writing boxes resized. Press Practice All to continue.')}},180)});window.addEventListener('load',create);
})();
</script></body></html>
