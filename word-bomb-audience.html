<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn4Plus Word Bomb — Audience</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400&display=swap" rel="stylesheet"><style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#eaf3ff;color:#153f7b;font-family:system-ui,sans-serif}
#grid{height:100dvh;width:100vw;padding:10px;display:grid;gap:7px;align-content:stretch}
.tile{position:relative;min-height:0;min-width:0;overflow:hidden;border:2px solid #b8d6ff;border-radius:11px;background:linear-gradient(150deg,#fff,#e9f3ff);display:flex;align-items:center;justify-content:center;padding:3px;color:#153f7b;cursor:pointer}
.tile>span{font-family:"LXGW WenKai TC","KaiTi","STKaiti",serif;font-weight:400;line-height:1.1;text-align:center;overflow-wrap:anywhere;max-width:100%}
.tile.bomb{border-color:#f0a52b;background:#fff0cf}
.tile.bomb:after{content:"💣";position:absolute;right:2px;top:1px;font-size:20px}
.tile.used{opacity:.55}
.tile ruby{display:inline-flex;flex-direction:column-reverse;align-items:center;white-space:nowrap;vertical-align:middle}
.tile ruby rt{font:400 .38em/1.1 system-ui,sans-serif;white-space:nowrap;min-height:1.2em}
.tile .ruby-face{display:flex;justify-content:center;flex-wrap:wrap;gap:0 .12em;align-items:center}
.tile .whole{display:flex;flex-direction:column;align-items:center}
.tile .whole small{font:400 .35em/1.1 system-ui,sans-serif}
#empty{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#6282ac;font-size:clamp(20px,3vw,40px)}
#boom{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#ffe45d,#ff7027 45%,#9b1431);color:white;z-index:10;animation:flash .6s 2}
#boom strong{font-size:clamp(65px,15vw,190px);text-shadow:0 10px #7b1c1c}
#boom p{font-size:clamp(18px,3vw,42px)}
@keyframes flash{50%{filter:brightness(1.8)}}
</style></head><body><div id="empty">Waiting for teacher…<div style="font-size:16px;margin-top:16px">Press F11 for fullscreen if needed</div></div><div id="grid"></div><div id="boom"><div><strong>💥 BOOM!</strong><p id="boomText"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.27.0/dist/index.js"></script>
<script>
(()=>{'use strict';
const channel=new BroadcastChannel('learn4plus_word_bomb_dual_v1'),grid=document.getElementById('grid');
let state=null;
const hanzi=s=>String(s).split('|')[0].trim();
const pinyinFor=s=>{
 const parts=String(s).split('|');if(parts.length>1&&parts[1].trim())return parts.slice(1).join('|').trim();
 try{const lib=window.pinyinPro||window.pinyinProDefault;if(lib&&lib.pinyin)return lib.pinyin(hanzi(s),{toneType:'symbol',type:'array'}).join(' ')}catch(e){}
 return '';
};
function draw(){
 if(!state)return;
 const words=state.words||[],count=words.length;
 document.getElementById('empty').style.display=count?'none':'grid';
 if(!count)return;
 // Use the exact column count sent by the teacher; do not auto-fit separately.
 const best=Math.max(1,Math.min(count,Number(state.cols)||6));
 const rows=Math.ceil(count/best);
 grid.style.gridTemplateColumns=`repeat(${best},minmax(0,1fr))`;
 grid.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
 grid.replaceChildren();
 words.forEach((entry,i)=>{
  const tile=document.createElement('button');tile.className='tile';
  if((state.visibleBombs||[]).includes(i))tile.classList.add('bomb');
  if((state.guessed||[]).includes(i))tile.classList.add('used');
  const label=document.createElement('span');
  const chinese=Array.from(hanzi(entry));
  if((state.flipped||[]).includes(i)){
   const py=pinyinFor(entry).split(/\s+/).filter(Boolean);
   if(py.length===chinese.length){
    label.className='ruby-face';
    chinese.forEach((char,j)=>{const ruby=document.createElement('ruby');ruby.textContent=char;
      const rt=document.createElement('rt');rt.textContent=py[j];ruby.append(rt);label.append(ruby)});
   }else{
    label.className='whole';const small=document.createElement('small');small.textContent=pinyinFor(entry);
    label.append(small,document.createTextNode(hanzi(entry)));
   }
  }else label.textContent=hanzi(entry);
  tile.append(label);
  tile.onclick=()=>channel.postMessage({type:'flip',index:i});
  grid.append(tile);
 });
 requestAnimationFrame(fit);
}
function fit(){
 grid.querySelectorAll('.tile').forEach(tile=>{
  const label=tile.firstElementChild;if(!label)return;
  const w=Math.max(24,tile.clientWidth-14),h=Math.max(15,tile.clientHeight-10);
  label.style.width=w+'px';label.style.maxHeight=h+'px';
  let lo=9,hi=Math.min(70,Math.floor(w*.7),Math.floor(h*.8));
  while(lo<hi){const mid=Math.ceil((lo+hi)/2);label.style.fontSize=mid+'px';
   if(label.scrollWidth<=w+1&&label.scrollHeight<=h+1)lo=mid;else hi=mid-1}
  label.style.fontSize=lo+'px';
 });
}
channel.onmessage=e=>{
 const m=e.data||{};
 if(m.type==='state'){state=m;draw()}
 if(m.type==='boom'){document.getElementById('boomText').textContent=m.description||'';
  document.getElementById('boom').style.display='grid'}
 if(m.type==='presentationPositioned'){document.title='Word Bomb — Audience (Screen 2)'}
 if(m.type==='closeBoom')document.getElementById('boom').style.display='none';
};
addEventListener('resize',draw);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();channel.postMessage({type:'hide'})}});
channel.postMessage({type:'ready'});
})();
</script></body></html>
